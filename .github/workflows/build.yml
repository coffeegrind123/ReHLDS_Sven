name: C/C++ CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/**'

  pull_request:
    types: [opened, reopened, synchronize]
  release:
    types: [published]
  workflow_dispatch:

# The plugin host bundled into gamedir/ is metamod-fallguys (hzqst/metamod-fallguys), a
# metamod-p fork whose declared target is Sven Co-op. It replaced Metamod-R on 2026-08-23.
#
# ⚠ ONE ref for BOTH halves, and it must stay that way. The Linux binary is BUILT FROM
# SOURCE in the `linux` job (see there for why the published .so is unusable) while the
# Windows binary comes from a release asset. Pinning those two independently ships a
# gamedir/ whose halves were built from different source, and nothing downstream would
# notice. A TAG is used rather than a commit because only a tag has release assets.
env:
  MMFG_REF: 'v20260730a'

jobs:
  windows:
    name: 'Windows'
    runs-on: windows-2025

    env:
      solution: 'msvc/ReHLDS.sln'
      buildPlatform: 'Win32'
      buildRelease: 'Release'
      buildReleasePlay: 'Release Play'
      buildTest: 'Test Fixes'
      # `secrets` is not a valid context in a step-level `if`, so resolve it here where it
      # is allowed and test the resulting env var instead.
      hasSigningCert: ${{ secrets.KEY_PFX_B64 != '' }}

    steps:
      - name: Configure
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

# TODO: add support of 141_xp toolchain at VS2022+
#      - name: Install v140, v141 and v142 toolsets
#        shell: cmd
#        run: |
#          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify ^
#          --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" ^
#          --add Microsoft.VisualStudio.Component.WindowsXP ^
#          --add Microsoft.VisualStudio.Component.VC.v140 ^
#          --add Microsoft.VisualStudio.Component.VC.v140.x86.x64 ^
#          --add Microsoft.VisualStudio.Component.VC.v140.xp ^
#          --add Microsoft.VisualStudio.Component.VC.140.CRT ^
#          --add Microsoft.VisualStudio.Component.VC.v141 ^
#          --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 ^
#          --add Microsoft.VisualStudio.Component.VC.v141.xp ^
#          --add Microsoft.VisualStudio.Component.VC.v142 ^
#          --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 ^
#          --quiet --norestart

      - name: Select PlatformToolset
        id: select_toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs2019 = & $vswhere -products * -version "[16.0,17.0)" -property installationPath -latest
          $vs2022 = & $vswhere -products * -version "[17.0,)" -property installationPath -latest
          
          if ($vs2019) {
            "toolset=v140_xp" >> $env:GITHUB_OUTPUT
            Write-Host "Selected v140_xp toolset"
          } elseif ($vs2022) {
            "toolset=v143" >> $env:GITHUB_OUTPUT
            Write-Host "Selected v143 toolset"
          } else {
            Write-Error "No suitable Visual Studio installation found"
            exit 1
          }

      - name: Build and Run unittests
        shell: pwsh
        run: |
          $toolset = '${{ steps.select_toolset.outputs.toolset }}'
          msbuild ${{ env.solution }} -p:Configuration="${{ env.buildTest }}" /t:Clean,Build /p:Platform=${{ env.buildPlatform }} /p:PlatformToolset=$toolset /p:XPDeprecationWarning=false
          .\"msvc\Test Fixes\swds.exe"
          If ($LASTEXITCODE -ne 0 -And
          $LASTEXITCODE -ne 3)
          {[Environment]::Exit(1)}

      - name: Build
        shell: pwsh
        run: |
          $toolset = '${{ steps.select_toolset.outputs.toolset }}'
          msbuild ${{ env.solution }} -p:Configuration="${{ env.buildRelease }}" /t:Clean,Build /p:Platform=${{ env.buildPlatform }} /p:PlatformToolset=$toolset /p:XPDeprecationWarning=false
          msbuild ${{ env.solution }} -p:Configuration="${{ env.buildReleasePlay }}" /t:Clean,Build /p:Platform=${{ env.buildPlatform }} /p:PlatformToolset=$toolset /p:XPDeprecationWarning=false

      - name: Get rcedit from chocolatey
        shell: pwsh
        run: |
          choco install rcedit -y

      - name: Move files
        run: |
          mkdir publish\debug
          mkdir publish\tests
          mkdir publish\bin\win32\svencoop\dlls
          move "msvc\${{ env.buildReleasePlay }}\swds.dll" publish\tests\swds.dll
          
          move msvc\${{ env.buildRelease }}\hlds.exe publish\bin\win32\hlds.exe
          move msvc\${{ env.buildRelease }}\hltv.exe publish\bin\win32\hltv.exe
          move msvc\${{ env.buildRelease }}\swds.dll publish\bin\win32\swds.dll
          move msvc\${{ env.buildRelease }}\core.dll publish\bin\win32\core.dll
          move msvc\${{ env.buildRelease }}\proxy.dll publish\bin\win32\proxy.dll
          move msvc\${{ env.buildRelease }}\demoplayer.dll publish\bin\win32\demoplayer.dll
          move msvc\${{ env.buildRelease }}\filesystem_stdio.dll publish\bin\win32\filesystem_stdio.dll
          move msvc\${{ env.buildRelease }}\director.dll publish\bin\win32\svencoop\dlls\director.dll
          # swds.dll is linked against THIS steam_api.dll; ship it so a release is usable alone.
          copy rehlds\lib\steam_api.dll publish\bin\win32\steam_api.dll
          move msvc\${{ env.buildRelease }}\hlds.pdb publish\debug\hlds.pdb
          move msvc\${{ env.buildRelease }}\hltv.pdb publish\debug\hltv.pdb
          move msvc\${{ env.buildRelease }}\swds.pdb publish\debug\swds.pdb
          move msvc\${{ env.buildRelease }}\core.pdb publish\debug\core.pdb
          move msvc\${{ env.buildRelease }}\proxy.pdb publish\debug\proxy.pdb
          move msvc\${{ env.buildRelease }}\demoplayer.pdb publish\debug\demoplayer.pdb
          move msvc\${{ env.buildRelease }}\filesystem_stdio.pdb publish\debug\filesystem_stdio.pdb
          move msvc\${{ env.buildRelease }}\director.pdb publish\debug\director.pdb

      - name: Get app version
        id: get_version
        shell: pwsh
        run: |
          $versionFile = "rehlds/version/appversion.h"
          if (-not (Test-Path $versionFile)) {
            Write-Error "Version file not found: $versionFile"
            exit 1
          }

          $content = Get-Content $versionFile
          foreach ($line in $content) {
            if ($line -match '^\s*#define\s+APP_VERSION\s+"([^"]+)"') {
              $version = $matches[1]
              "version=$version" >> $env:GITHUB_OUTPUT
              Write-Host "Found version: $version"
              exit 0
            }
          }
          Write-Error "APP_VERSION not found in file"
          exit 1

      - name: Show version
        run: echo "Version is ${{ steps.get_version.outputs.version }}"
      - name: Edit resources at windows binaries
        run: |
         
         rcedit ${{ github.workspace }}\publish\bin\win32\hlds.exe --set-version-string ProductName "ReHLDS" --set-file-version "${{ steps.get_version.outputs.version }}" --set-product-version "${{ steps.get_version.outputs.version }}" --set-version-string FileDescription "The Half-Life Dedicated Server, Commit: $env:GITHUB_SHA" --set-version-string "Comments" "Commit: $env:GITHUB_SHA" --set-version-string CompanyName "ReHLDS Dev Team" --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam"
         rcedit ${{ github.workspace }}\publish\bin\win32\hltv.exe --set-version-string ProductName "ReHLTV" --set-file-version "${{ steps.get_version.outputs.version }}" --set-product-version "${{ steps.get_version.outputs.version }}" --set-version-string FileDescription "The Half-Life TV, Commit: $env:GITHUB_SHA" --set-version-string "Comments" "Commit: $env:GITHUB_SHA" --set-version-string CompanyName "ReHLDS Dev Team" --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam"
         rcedit ${{ github.workspace }}\publish\tests\swds.dll --set-version-string ProductName "swds.dll" --set-file-version "${{ steps.get_version.outputs.version }}" --set-product-version "${{ steps.get_version.outputs.version }}" --set-version-string FileDescription "A dll used by Steamworks Dedicated Servers, Commit: $env:GITHUB_SHA" --set-version-string "Comments" "Commit: $env:GITHUB_SHA" --set-version-string CompanyName "ReHLDS Dev Team" --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" --set-icon rehlds/dedicated/msvc/icon.ico
         rcedit ${{ github.workspace }}\publish\bin\win32\swds.dll --set-version-string ProductName "swds.dll" --set-file-version "${{ steps.get_version.outputs.version }}" --set-product-version "${{ steps.get_version.outputs.version }}" --set-version-string FileDescription "A ddll used by Steamworks Dedicated Servers, Commit: $env:GITHUB_SHA" --set-version-string "Comments" "Commit: $env:GITHUB_SHA" --set-version-string CompanyName "ReHLDS Dev Team" --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" --set-icon rehlds/dedicated/msvc/icon.ico
         rcedit ${{ github.workspace }}\publish\bin\win32\core.dll --set-version-string ProductName "core.dll" --set-file-version "${{ steps.get_version.outputs.version }}" --set-product-version "${{ steps.get_version.outputs.version }}" --set-version-string FileDescription " A dll, it is a core of game engine, Commit: $env:GITHUB_SHA" --set-version-string "Comments" "Commit: $env:GITHUB_SHA" --set-version-string CompanyName "ReHLDS Dev Team" --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" --set-icon rehlds/dedicated/msvc/icon.ico
         rcedit ${{ github.workspace }}\publish\bin\win32\proxy.dll --set-version-string ProductName "proxy.dll" --set-file-version "${{ steps.get_version.outputs.version }}" --set-product-version "${{ steps.get_version.outputs.version }}" --set-version-string FileDescription "A dll for proxying network connections, Commit: $env:GITHUB_SHA" --set-version-string "Comments" "Commit: $env:GITHUB_SHA" --set-version-string CompanyName "ReHLDS Dev Team" --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" --set-icon rehlds/dedicated/msvc/icon.ico
         rcedit ${{ github.workspace }}\publish\bin\win32\demoplayer.dll --set-version-string ProductName "demoplayer.dll" --set-file-version "${{ steps.get_version.outputs.version }}" --set-product-version "${{ steps.get_version.outputs.version }}" --set-version-string FileDescription "A dll for demoplayer functionality, Commit: $env:GITHUB_SHA" --set-version-string "Comments" "Commit: $env:GITHUB_SHA" --set-version-string CompanyName "ReHLDS Dev Team" --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" --set-icon rehlds/dedicated/msvc/icon.ico
         rcedit ${{ github.workspace }}\publish\bin\win32\filesystem_stdio.dll --set-version-string ProductName "filesystem_stdio.dll" --set-file-version "${{ steps.get_version.outputs.version }}" --set-product-version "${{ steps.get_version.outputs.version }}" --set-version-string FileDescription "A dll that manages file input/output operations, Commit: $env:GITHUB_SHA" --set-version-string "Comments" "Commit: $env:GITHUB_SHA" --set-version-string CompanyName "ReHLDS Dev Team" --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" --set-icon rehlds/dedicated/msvc/icon.ico
         rcedit ${{ github.workspace }}\publish\bin\win32\svencoop\dlls\director.dll --set-version-string ProductName "director.dll" --set-file-version "${{ steps.get_version.outputs.version }}" --set-product-version "${{ steps.get_version.outputs.version }}" --set-version-string FileDescription "A dll used for Director functionality in Half-Life 1, Commit: $env:GITHUB_SHA" --set-version-string "Comments" "Commit: $env:GITHUB_SHA" --set-version-string CompanyName "ReHLDS Dev Team" --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" --set-icon rehlds/dedicated/msvc/icon.ico
        shell: "pwsh"

      - name: Import PFX and sign
        # Authenticode cert is an upstream ReHLDS secret; skip when the fork has none.
        if: github.event_name != 'pull_request' && env.hasSigningCert == 'true'
        env:
          KEY_PFX_PASS: ${{ secrets.KEY_PFX_PASS }}
        # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
        run: |
               $pfxBase64 = "${{ secrets.KEY_PFX_B64 }}"
               [IO.File]::WriteAllBytes("${{ github.workspace }}\signing-cert.pfx", [Convert]::FromBase64String($pfxBase64))
               certutil -f -p "${{ secrets.KEY_PFX_PASS }}" -importPFX "${{ github.workspace }}\signing-cert.pfx"
               
               & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\signtool.exe' sign /a /f "${{ github.workspace }}\signing-cert.pfx"  /p $env:KEY_PFX_PASS /d "ReHLDS" /du "https://rehlds.dev/" /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 /v ${{ github.workspace }}\publish\bin\win32\hlds.exe
               & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\signtool.exe' sign /a /f "${{ github.workspace }}\signing-cert.pfx"  /p $env:KEY_PFX_PASS /d "reHLTV" /du "https://rehlds.dev/" /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 /v ${{ github.workspace }}\publish\bin\win32\hltv.exe
               & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\signtool.exe' sign /a /f "${{ github.workspace }}\signing-cert.pfx"  /p $env:KEY_PFX_PASS /d "ReHLDS - swds.dll" /du "https://rehlds.dev/" /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 /v ${{ github.workspace }}\publish\tests\swds.dll
               & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\signtool.exe' sign /a /f "${{ github.workspace }}\signing-cert.pfx"  /p $env:KEY_PFX_PASS /d "ReHLDS - swds.dll" /du "https://rehlds.dev/" /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 /v ${{ github.workspace }}\publish\bin\win32\swds.dll
               & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\signtool.exe' sign /a /f "${{ github.workspace }}\signing-cert.pfx"  /p $env:KEY_PFX_PASS /d "ReHLDS - core.dll" /du "https://rehlds.dev/" /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 /v ${{ github.workspace }}\publish\bin\win32\core.dll
               & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\signtool.exe' sign /a /f "${{ github.workspace }}\signing-cert.pfx"  /p $env:KEY_PFX_PASS /d "ReHLDS - proxy.dll" /du "https://rehlds.dev/" /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 /v ${{ github.workspace }}\publish\bin\win32\proxy.dll
               & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\signtool.exe' sign /a /f "${{ github.workspace }}\signing-cert.pfx"  /p $env:KEY_PFX_PASS /d "ReHLDS - demoplayer.dll" /du "https://rehlds.dev/" /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 /v ${{ github.workspace }}\publish\bin\win32\demoplayer.dll
               & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\signtool.exe' sign /a /f "${{ github.workspace }}\signing-cert.pfx"  /p $env:KEY_PFX_PASS /d "ReHLDS - filesystem_stdio.dll" /du "https://rehlds.dev/" /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 /v ${{ github.workspace }}\publish\bin\win32\filesystem_stdio.dll
               & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\signtool.exe' sign /a /f "${{ github.workspace }}\signing-cert.pfx"  /p $env:KEY_PFX_PASS /d "ReHLDS - director.dll" /du "https://rehlds.dev/" /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 /v ${{ github.workspace }}\publish\bin\win32\svencoop\dlls\director.dll
               Remove-Item -Recurse -Force "${{ github.workspace }}\signing-cert.pfx"
        shell: "pwsh"

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win32
          path: publish/*

  testdemos:
    name: 'Test demos'
    runs-on: ubuntu-24.04
    container: rehldsorg/testdemos:latest
    needs: [windows]
    # Disabled for ReHLDS_Sven. These are recorded stock Half-Life/CS demos replayed against
    # the rehldsorg/testdemos image, which ships 'valve' and 'cstrike' gamedirs. A REHLDS_SVEN
    # build hardcodes the 'svencoop' basedir and changes the wire format (short-length user
    # messages, long-encoded coords, 4-bit delta byte counts, raised qlimits), so these demos
    # cannot replay correctly by construction -- this is not a regression to chase.
    # Re-enable once Sven Co-op demos exist to replay against.
    if: false
    defaults:
      run:
        shell: bash
        working-directory: /opt/HLDS

    strategy:
      fail-fast: false
      matrix:
        test: [
          { file: 'cstrike-muliplayer-1',       desc: 'CS: Multiplayer' },
          { file: 'rehlds-phys-single1',        desc: 'Half-Life: Physics singleplayer' },
          { file: 'crossfire-1-multiplayer-1',  desc: 'Half-Life: Multiplayer on crossfire map' },
          { file: 'shooting-hl-1',              desc: 'Half-Life: Shooting with several weapons' },
        ]

    steps:
      - name: Deploying windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win32

      - name: Setup dependencies
        run: |
          chown root ~
          rsync -a deps/rehlds/* .
          mv $GITHUB_WORKSPACE/tests/swds.dll .

      - name: Play test
        env:
          demo: ${{ matrix.test.file }}
          desc: ${{ matrix.test.desc }}
        run: ./runTest.sh

  linux:
    name: 'Linux'
    runs-on: ubuntu-24.04
    container: debian:11-slim

    env:
      # `secrets` is not a valid context in a step-level `if`, so resolve it here where it
      # is allowed and test the resulting env var instead.
      hasGpgKey: ${{ secrets.KEY_ASC != '' }}

    steps:
      - name: Install dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y \
            gcc-multilib g++-multilib \
            build-essential \
            libc6-dev libc6-dev-i386 \
            git cmake rsync \
            ca-certificates \
            g++ gcc

      - name: Configure
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GPG Import
        run: |
          echo "${{ secrets.PUB_ASC }}" > "${{ secrets.PUB_ASC_FILE }}"
          echo "${{ secrets.KEY_ASC }}" > "${{ secrets.KEY_ASC_FILE }}"

          # Import the public key
          gpg --batch --yes --import "${{ secrets.PUB_ASC_FILE }}"
          if [[ $? -ne 0 ]]; then
            echo "Error: Failed to import the public key"
            exit 1
          fi
          
          # Import the private key
          gpg --batch --yes --import "${{ secrets.KEY_ASC_FILE }}"
          if [[ $? -ne 0 ]]; then
            echo "Error: Failed to import the private key"
            exit 2
          fi
          
          # Extract the fingerprint of the imported public key
          GPG_LINUX_FINGERPRINT=$(gpg --list-keys --with-colons | grep '^fpr' | head -n 1 | cut -d: -f10)
          
          # Check if the fingerprint was extracted
          if [[ -z "$GPG_LINUX_FINGERPRINT" ]]; then
            echo "Error: Failed to extract the fingerprint of the key"
            exit 3
          fi
          
          # Set the trust level for the key
          echo "$GPG_LINUX_FINGERPRINT:6:" | gpg --batch --import-ownertrust
          if [ $? -ne 0 ]; then
            echo "Error: Failed to set trust for the key $GPG_LINUX_FINGERPRINT"
            exit 4
          fi
          
          echo "Key $GPG_LINUX_FINGERPRINT successfully imported and trusted"
          gpg --list-keys

          #export for global use
          echo "GPG_LINUX_FINGERPRINT=$GPG_LINUX_FINGERPRINT" >> $GITHUB_ENV
        shell: bash
        # The signing keys are upstream ReHLDS secrets. This fork does not carry them, and
        # the step exits non-zero on an empty key, so skip it unless they are configured.
        if: github.event_name != 'pull_request' && env.hasGpgKey == 'true'

      - name: Build and Run unittests
        run: |
          rm -rf build && cmake -DCMAKE_BUILD_TYPE=Unittests -B build && cmake --build build -j8
          retVal=0
          export LD_LIBRARY_PATH="rehlds/lib/linux32:$LD_LIBRARY_PATH"
          ./build/rehlds/engine_i486 2> /dev/null > result.log || retVal=$?
          while read line; do
            if [[ ${line} == *"Warning in test"* ]] ; then
              echo -e "\e[2;38m$line"
            elif [[ ${line} == *"Failure in test"* ]] ; then
              echo -e "\e[1;31m$line"
            else
              echo -e "\e[0;33m$line"
            fi
          done <<< $(cat result.log)

          if [ $retVal -ne 0 ] && [ $retVal -ne 3 ]; then
            echo -e "\e[30;41mExit code: $retVal\e[0m"
            exit 1 # Unittest failed
          else
            echo -e "\e[30;43mExit code: $retVal\e[0m"
          fi
        shell: bash

      - name: Build using GCC Compiler
        run: |
          rm -rf build && cmake -B build && cmake --build build -j8

      # ⚠⚠ BUILT HERE, NOT DOWNLOADED — and upstream's README says the opposite.
      #
      # metamod-fallguys claims its makefile forces glibc 2.24 so "the compiled binaries
      # (.so) are portable now". True of the MAKE path (metamod/Makefile sets GLIBCHEADER,
      # fed to -include by metamod/Config.mak) and false of what actually ships: its CI runs
      # scripts/build-all-opt.linux_i386.sh, whose last step is the CMAKE script, and that
      # script's -DLINK_AGAINST_OLDER_GLIBC=TRUE -DOLDER_GLIBC_PATH=... is a flag NO
      # CMakeLists.txt in that tree reads. It is silently ignored and the binary inherits
      # ubuntu-24.04's glibc. Measured on release v20260730a: GLIBC_2.38.
      #
      # This job is the only bullseye (GLIBC_2.31) environment in the workflow -- `publish`
      # is a bare ubuntu-24.04 runner and building there would reproduce the exact bug. So
      # the .so is built here and travels to `publish` inside the linux32 artifact.
      #
      # It lands in publish/plugins/ rather than publish/bin/, because the packaging step
      # archives `bin/ hlsdk/ gamedir/` by name -- this is a build intermediate that must
      # reach the bundling step without becoming a release path of its own.
      - name: Build metamod-fallguys (Linux)
        run: |
          set -euo pipefail
          rm -rf _mmfg
          git clone --depth 1 --branch "$MMFG_REF" \
            https://github.com/hzqst/metamod-fallguys.git _mmfg
          # capstone + procmap only: metamod links both with --whole-archive. bullet3 is
          # needed solely by the `fallguys` plugin, which this overlay does not ship.
          git -C _mmfg submodule update --init --recursive \
            thirdparty/capstone_fork thirdparty/procmap_fork
          cd _mmfg
          # These two install prefixes are HARDCODED in metamod-fallguys' top-level
          # CMakeLists.txt as thirdparty/install/<lib>/opt.linux_i386, where the
          # `opt.linux_i386` half is derived from CMAKE_BUILD_TYPE != Debug. Changing the
          # build type moves the prefix and the metamod link then fails to find them.
          cmake -S thirdparty/procmap_fork -B thirdparty/build/procmap/opt.linux_i386 \
            -DCMAKE_INSTALL_PREFIX="$PWD/thirdparty/install/procmap/opt.linux_i386" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 >/dev/null
          cmake --build thirdparty/build/procmap/opt.linux_i386 --target install -j"$(nproc)" >/dev/null
          cmake -S thirdparty/capstone_fork -B thirdparty/build/capstone/opt.linux_i386 \
            -DCMAKE_INSTALL_PREFIX="$PWD/thirdparty/install/capstone/opt.linux_i386" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 \
            -DCAPSTONE_ARCHITECTURE_DEFAULT=FALSE -DCAPSTONE_X86_SUPPORT=TRUE \
            -DCAPSTONE_BUILD_SHARED=FALSE -DCAPSTONE_BUILD_STATIC=TRUE \
            -DCAPSTONE_BUILD_CSTOOL=FALSE -DCAPSTONE_BUILD_TESTS=FALSE \
            -DCAPSTONE_INSTALL=TRUE >/dev/null
          cmake --build thirdparty/build/capstone/opt.linux_i386 --target install -j"$(nproc)" >/dev/null
          # --whole-archive needs these to exist as STATIC libs; a missing one fails the
          # link with a bare -lcapstone/-lprocmap error that names no prefix.
          for a in thirdparty/install/procmap/opt.linux_i386/lib/libprocmap.a \
                   thirdparty/install/capstone/opt.linux_i386/lib/libcapstone.a; do
            [ -f "$a" ] || { echo "FATAL: $a was not produced" >&2; exit 1; }
          done
          # Named target, not `--target install`: the top-level install() lists all six
          # products and would drag in fallguys, hence bullet3.
          cmake -B build-cmake/opt.linux_i386 -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake/opt.linux_i386 -j"$(nproc)" --target metamod
          cd ..
          mkdir -p publish/plugins
          src=$(find _mmfg/build-cmake/opt.linux_i386/output -name 'metamod.so' -print -quit)
          [ -n "$src" ] || { echo "FATAL: metamod.so was not produced" >&2; exit 1; }
          cp "$src" publish/plugins/metamod.so
          # The engine loads this as a game DLL. Without these entry points it reports only
          # "Failure to load game DLL", naming neither the symbol nor the file.
          for s in GiveFnptrsToDll GetEntityAPI2 GetNewDLLFunctions Meta_Query; do
            grep -aq "$s" publish/plugins/metamod.so \
              || { echo "FATAL: metamod.so does not export $s" >&2; exit 1; }
          done
          # The control for those four: a string that cannot be present must NOT match, or
          # the greps are matching everything and proved nothing.
          if grep -aq 'zzz_not_in_any_binary_zzz' publish/plugins/metamod.so; then
            echo "FATAL: the export probe matches everything" >&2; exit 1
          fi
          rm -rf _mmfg
        shell: bash

      - name: Prepare HLSDK
        run: |
          mkdir -p publish/hlsdk
          rsync -a rehlds/common/ publish/hlsdk/common/
          rsync -a rehlds/dlls/ publish/hlsdk/dlls/
          rsync -a rehlds/pm_shared/ publish/hlsdk/pm_shared/
          rsync -a rehlds/public/ publish/hlsdk/public/ --exclude rehlds/
          rsync -a rehlds/public/rehlds/ publish/hlsdk/engine

      - name: Move files
        run: |
          mkdir -p publish/bin/linux32/svencoop/dlls		  
          
          mv build/rehlds/engine_i486.so publish/bin/linux32/engine_i486.so
          mv rehlds/version/appversion.h publish/appversion.h
          mv build/rehlds/dedicated/hlds_linux publish/bin/linux32/hlds_linux
          mv build/rehlds/HLTV/Console/hltv publish/bin/linux32/hltv
          mv build/rehlds/HLTV/Core/core.so publish/bin/linux32/core.so
          mv build/rehlds/HLTV/Proxy/proxy.so publish/bin/linux32/proxy.so
          mv build/rehlds/HLTV/DemoPlayer/demoplayer.so publish/bin/linux32/demoplayer.so
          mv build/rehlds/HLTV/Director/director.so publish/bin/linux32/svencoop/dlls/director.so
          mv build/rehlds/filesystem/FileSystem_Stdio/filesystem_stdio.so publish/bin/linux32/filesystem_stdio.so
          # engine_i486.so is linked against THIS libsteam_api.so and needs its
          # SteamInternal_SteamAPI_Init, which retail Sven's copy does not export --
          # without it a deployment dies at "undefined symbol: SteamInternal_SteamAPI_Init
          # / Unable to load engine, image is corrupt." Ship it so a release is usable
          # on its own.
          cp rehlds/lib/linux32/libsteam_api.so publish/bin/linux32/libsteam_api.so

      - name: Run GLIBC/ABI version compat test
        run: |
          binaries=(
            "publish/bin/linux32/engine_i486.so"
            "publish/bin/linux32/hlds_linux"
            "publish/bin/linux32/hltv"
            "publish/bin/linux32/core.so"
            "publish/bin/linux32/proxy.so"
            "publish/bin/linux32/demoplayer.so"
            "publish/bin/linux32/svencoop/dlls/director.so"
            "publish/bin/linux32/filesystem_stdio.so"
            # metamod.so goes through the SAME gate as the engine binaries, deliberately.
            # It is the file most likely to regress here -- upstream's published build needs
            # GLIBC_2.38 and would load on the CI runner while failing on every deployment
            # target, so "it built" is not evidence. This gate is what makes it evidence.
            "publish/plugins/metamod.so"
          )
          bash ./rehlds/version/glibc_test.sh ${binaries[@]}
          if [[ $? -ne 0 ]]; then
            exit 1 # Assertion failed
          fi
        shell: bash

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        id: upload-job
        with:
          name: linux32
          path: publish/*

  publish:
    name: 'Publish'
    runs-on: ubuntu-24.04
    # testdemos is disabled for this fork (see above); a skipped job never satisfies `needs`,
    # so it is dropped here rather than silently gating every publish.
    needs: [windows, linux]

    # Attaching assets to a release needs write access to contents. This repository's
    # default workflow permission is read-only, so request it explicitly here rather
    # than loosening the default for every job.
    permissions:
      contents: write

    steps:
      # Must come FIRST: actions/checkout cleans the workspace, so running it after the
      # downloads would delete the artifacts. Needed so the bundling step can check the
      # salt sentinel it writes still matches the engine's REUNION_SALT_SENTINEL.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploying linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux32

      - name: Deploying windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win32

      - name: Reading appversion.h
        run: |
          if [ -e appversion.h ]; then
            APP_VERSION=$(cat appversion.h | grep -wi '#define APP_VERSION_STRD' | sed -e 's/#define APP_VERSION_STRD[ \t\r\n\v\f]\+\(.*\)/\1/i' -e 's/\r//g')
            if [ $? -ne 0 ]; then
              APP_VERSION=""
            else
              # Remove quotes
              APP_VERSION=$(echo $APP_VERSION | xargs)
              echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
            fi
          fi
          rm -f appversion.h

      - name: Bundle metamod-fallguys and ReUnion into gamedir/
        env:
          # Pinned, not "latest", so a release is reproducible and we only ever ship
          # plugin versions this stack has actually been run against. Bump deliberately.
          REUNION_VERSION: '0.2.0.25'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf _plug gamedir && mkdir -p _plug gamedir/addons/metamod/dlls gamedir/addons/reunion

          # ⚠ THE TWO HALVES COME FROM DIFFERENT PLACES, AND ONLY ONE IS DOWNLOADABLE.
          #   linux   -> built from source in the `linux` job (see the long note there:
          #              the published .so needs GLIBC_2.38 and cannot load on the bullseye
          #              targets this fork ships for), arriving via the linux32 artifact.
          #   windows -> the release asset, which has no glibc to be wrong about.
          # Both are pinned to $MMFG_REF at the workflow level so they cannot drift apart.
          [ -f plugins/metamod.so ] || {
            echo "FATAL: plugins/metamod.so missing from the linux32 artifact." >&2
            echo "       The 'Build metamod-fallguys (Linux)' step in the linux job is what" >&2
            echo "       produces it; do NOT substitute the upstream release asset here." >&2
            exit 1; }
          gh release download "$MMFG_REF" --repo hzqst/metamod-fallguys \
            --pattern 'metamod-fallguys-windows-x86.zip' -O _plug/mm.zip
          gh release download "$REUNION_VERSION" --repo rehlds/reunion --pattern '*.zip' -O _plug/ru.zip
          unzip -q _plug/mm.zip -d _plug/mm
          unzip -q _plug/ru.zip -d _plug/ru

          # ⚠ metamod-fallguys lives in addons/metamod/DLLS/, not addons/metamod/ as
          # Metamod-R did. Whatever writes liblist.gam downstream must point at
          # "addons/metamod/dlls/metamod.so" -- this overlay does not ship liblist.gam,
          # so that path change does NOT propagate on its own.
          cp plugins/metamod.so                       gamedir/addons/metamod/dlls/
          cp _plug/mm/build/addons/metamod/dlls/metamod.dll gamedir/addons/metamod/dlls/
          # ReUnion ships flat bin/<platform>/ instead.
          cp _plug/ru/bin/Linux/reunion_mm_i386.so   gamedir/addons/reunion/
          cp _plug/ru/bin/Windows/reunion_mm.dll     gamedir/addons/reunion/

          # Metamod must be told the REAL game library: liblist.gam points at Metamod,
          # so without this it would recurse into itself.
          #
          # ⚠⚠ THE KEY IS `gamedll`, AND THIS INVERTS WHAT THIS FILE SAID UNTIL 2026-08-23.
          # Under Metamod-R a bare `gamedll` line was HARMFUL: it was applied over
          # gamedll_linux on Linux too, so the server tried to load dlls\server.dll and died
          # with "Failure to load game DLL" after Metamod's full banner. metamod-fallguys is
          # metamod-p derived and its option table (metamod/metamod.cpp, global_options[])
          # has exactly ONE entry -- {"gamedll", CF_PATH, ...}. There is no gamedll_linux and
          # no gamedll_win32; the old key is simply unrecognised.
          #
          # ⚠ And an unrecognised key does NOT fail: MConfig::set() returns ME_NOTFOUND,
          # metamod warns once, then `autodetect yes` (the default) resolves the game DLL
          # from metamod/games.h, which carries {"svencoop", "server.so", "server.dll", ...}.
          # So a stale gamedll_linux line still boots a working server, via a silent
          # fallback, until a gamedir or a games.h entry changes. Hence: set it explicitly.
          #
          # CF_PATH resolves through full_gamedir_path(), i.e. relative to the gamedir.
          # Windows deployments comment the linux line and uncomment the windows one --
          # one key means the per-OS choice has to be made in the file.
          cat > gamedir/addons/metamod/config.ini <<'EOF'
          // metamod-fallguys (metamod-p) config. gamedll is the REAL game library;
          // liblist.gam points at metamod itself, so without this line metamod would
          // recurse into itself.
          //
          // The key is `gamedll` on BOTH platforms -- metamod-p has no gamedll_linux /
          // gamedll_win32. (Metamod-R did, and warned against a bare `gamedll`; that
          // warning is inverted here and does not apply to this metamod.)
          //
          // Windows: comment the line below and uncomment this one instead.
          //gamedll dlls\server.dll
          gamedll dlls/server.so
          EOF

          # ReUnion MUST load first: it intercepts the connect/auth path, so anything
          # loaded before it would see clients it would have rejected.
          #
          # ⚠ ReUnion declares interface 5:13 and this metamod is 5:16. mplugin.cpp accepts
          # same-major/older-minor, so it loads and logs "using an older interface version
          # (5:13), not the latest (5:16)". That line is a NOTE, not a failure.
          #
          # ⚠ And unlike Metamod-R, this metamod prints NOTHING on a successful plugin load
          # -- there is no "Read plugin config for: Reunion". A startup-log grep for
          # "reunion" comes back empty on a perfectly healthy server. `meta list` showing
          # "[ 1] Reunion  RUN" is the only proof.
          cat > gamedir/addons/metamod/plugins.ini <<'EOF'
          ; metamod-fallguys plugin list. ReUnion MUST be first -- it intercepts the
          ; connect/auth path, so anything loaded before it can see clients it would
          ; have rejected.
          linux addons/reunion/reunion_mm_i386.so
          win32 addons\reunion\reunion_mm.dll
          EOF

          # Start from ReUnion's OWN shipped config so this tracks whatever version is
          # pinned above, and change only the AUTHID policy.
          #
          # cid_* == 5 means DROP THE CLIENT. Upstream ships cid_NoSteam47/48 = 5, i.e.
          # plain non-Steam clients are rejected by default -- the exact opposite of why
          # anyone deploys ReUnion. 3 = accept and assign a generated STEAM_x:y:z.
          sed -e 's/^cid_NoSteam47 = 5/cid_NoSteam47 = 3/' \
              -e 's/^cid_NoSteam48 = 5/cid_NoSteam48 = 3/' \
              _plug/ru/reunion.cfg > gamedir/reunion.cfg

          # SteamIdHashSalt is NOT optional: with AuthVersion = 3 an empty salt makes
          # ReUnion fail to init, and it fails almost silently -- Metamod still reports
          # "Read plugin config for: Reunion" and the server boots and plays normally.
          # Only `meta list` shows the truth.
          #
          # But a salt baked into a public release is not a secret either -- everyone who
          # downloaded it has the same value. So ship a SENTINEL and let the engine mint a
          # real one per deployment on first run (Sven_LocalizeReunionSalt, sys_dll.cpp),
          # writing it to <gamedir>/.reunion_salt so later upgrades restore rather than
          # rotate it.
          sed -i "s|^SteamIdHashSalt =.*|SteamIdHashSalt = GENERATE_ON_FIRST_RUN|" gamedir/reunion.cfg

          printf '%s\n' \
            ';; ================================================================' \
            ';; SteamIdHashSalt below is a PLACEHOLDER, not a usable value.' \
            ';;' \
            ';; ReHLDS_Sven replaces it with a salt generated from the OS CSPRNG the' \
            ';; first time the server starts, and saves a copy to .reunion_salt in this' \
            ';; directory. Nothing to do by hand.' \
            ';;' \
            ';; !! KEEP .reunion_salt. It is what lets a later release be unpacked over' \
            ';; !! this install without minting a NEW salt -- and a new salt changes every' \
            ';; !! generated STEAM_x:y:z, which invalidates every ban and every stored' \
            ';; !! per-player record.' \
            ';;' \
            ';; Setting a real value here by hand disables all of the above; the engine' \
            ';; never touches a salt it did not place. rotate-reunion-salt.sh forces a new' \
            ';; one, with the same consequences as above.' \
            ';; ================================================================' \
            '' > gamedir/.cfghdr
          cat gamedir/.cfghdr gamedir/reunion.cfg > gamedir/reunion.cfg.new
          mv gamedir/reunion.cfg.new gamedir/reunion.cfg
          rm -f gamedir/.cfghdr

          cat > gamedir/rotate-reunion-salt.sh <<'EOF'
          #!/bin/sh
          # Rotate the ReUnion SteamIdHashSalt. Run once per deployment, then leave alone:
          # rotating invalidates every generated SteamID (bans, per-player records).
          set -eu
          CFG="${1:-$(dirname "$0")/reunion.cfg}"
          [ -f "$CFG" ] || { echo "no such config: $CFG" >&2; exit 1; }
          SALT=$(head -c 48 /dev/urandom | od -An -tx1 | tr -d ' \n' | cut -c1-48)
          sed -i "s|^SteamIdHashSalt =.*|SteamIdHashSalt = $SALT|" "$CFG"
          grep -qE "^SteamIdHashSalt = .{32,}" "$CFG" || { echo "FAILED to write salt" >&2; exit 1; }
          echo "rotated SteamIdHashSalt in $CFG (${#SALT} chars)"
          EOF
          chmod +x gamedir/rotate-reunion-salt.sh

          # Guard the result rather than trusting the staging above.
          # NOTE the dlls/ subdirectory and the metamod.so name -- both changed with the
          # move off Metamod-R, and these two lines are what stop the old layout coming
          # back unnoticed through an edit further up.
          test -s gamedir/addons/metamod/dlls/metamod.so
          test -s gamedir/addons/metamod/dlls/metamod.dll
          test -s gamedir/addons/reunion/reunion_mm_i386.so
          test -s gamedir/addons/reunion/reunion_mm.dll
          # The bundled .so must be the one built on bullseye, not upstream's release. The
          # linux job's GLIBC gate already covers it, but this overlay is assembled on a
          # ubuntu-24.04 runner where a hand-substituted release binary would look fine.
          # An EMPTY match fails too: that is the control, since grep finding nothing would
          # otherwise read exactly like a pass.
          mmg=$(grep -ao 'GLIBC_2\.[0-9]*' gamedir/addons/metamod/dlls/metamod.so | sort -uV | tail -1)
          [ -n "$mmg" ] || { echo "FATAL: no GLIBC_* in bundled metamod.so -- probe broken" >&2; exit 1; }
          [ "$(printf '%s\n%s\n' "$mmg" "GLIBC_2.31" | sort -V | tail -1)" = "GLIBC_2.31" ] \
            || { echo "FATAL: bundled metamod.so requires $mmg; deployment targets supply GLIBC_2.31." >&2
                 echo "       This is upstream's release asset, not the bullseye build." >&2; exit 1; }
          echo "ok: bundled metamod.so requires at most $mmg"
          grep -qE '^cid_NoSteam47 = 3' gamedir/reunion.cfg || { echo "FATAL: cid_NoSteam47 not 3 (5 = DROP)" >&2; exit 1; }
          grep -qE '^cid_NoSteam48 = 3' gamedir/reunion.cfg || { echo "FATAL: cid_NoSteam48 not 3 (5 = DROP)" >&2; exit 1; }
          grep -qE '^SteamIdHashSalt = GENERATE_ON_FIRST_RUN$' gamedir/reunion.cfg || { echo "FATAL: salt sentinel not written; the engine would not localise it and ReUnion would fail to init" >&2; exit 1; }
          grep -q 'GENERATE_ON_FIRST_RUN' rehlds/engine/sys_dll.cpp || { echo "FATAL: sentinel does not match the engine's REUNION_SALT_SENTINEL" >&2; exit 1; }
          echo "--- gamedir/ ---"; find gamedir -type f | sort
          rm -rf _plug

      # GPG signing is opt-in on the secrets actually being present.
      #
      # Upstream gated this on the event type alone, which is wrong for a fork: PUB_ASC /
      # KEY_ASC / PUB_ASC_FILE / KEY_ASC_FILE are upstream ReHLDS secrets this repository
      # does not have, so `echo "$PUB_ASC" > "$PUB_ASC_FILE"` became a redirect to the empty
      # filename, which under the default `bash -e` killed the whole packaging step -- and
      # with it the upload, since the release step needs packaging-job to have succeeded.
      # Every release-triggered build failed that way and only a manual workflow_dispatch
      # (event_name != release, so SIGN_READY=false) ever produced assets.
      #
      # Secrets are not usable in a step-level `if:`, so they come in through `env:` and are
      # tested here for non-emptiness. All four present -> sign; any missing -> ship unsigned
      # rather than fail the release.
      - name: Set SIGN_READY env
        env:
          PUB_ASC: ${{ secrets.PUB_ASC }}
          KEY_ASC: ${{ secrets.KEY_ASC }}
          PUB_ASC_FILE: ${{ secrets.PUB_ASC_FILE }}
          KEY_ASC_FILE: ${{ secrets.KEY_ASC_FILE }}
        run: |
          if [[ "${{ github.event_name }}" == "release" && \
                "${{ github.event.action }}" == "published" && \
                "${{ github.ref }}" == refs/tags/* ]]; then
            if [[ -n "$PUB_ASC" && -n "$KEY_ASC" && -n "$PUB_ASC_FILE" && -n "$KEY_ASC_FILE" ]]; then
              echo "SIGN_READY=true" >> $GITHUB_ENV
            else
              echo "::notice::GPG signing secrets not configured; publishing unsigned archives."
              echo "SIGN_READY=false" >> $GITHUB_ENV
            fi
          else
           echo "SIGN_READY=false" >> $GITHUB_ENV
          fi

      - name: Final signing and Packaging bin/dbg
        id: packaging-job
        env:
          # Through env, not inline ${{ }} interpolation: an unset secret then reaches the
          # script as an empty variable that can be tested, instead of being spliced into
          # the command line as an empty word. SIGN_READY already guarantees all four are
          # non-empty when this branch runs.
          PUB_ASC: ${{ secrets.PUB_ASC }}
          KEY_ASC: ${{ secrets.KEY_ASC }}
          PUB_ASC_FILE: ${{ secrets.PUB_ASC_FILE }}
          KEY_ASC_FILE: ${{ secrets.KEY_ASC_FILE }}
        run: |
          if [[ "$SIGN_READY" == "true" ]]; then
            echo "Signing avalible."

            echo "$PUB_ASC" > "$PUB_ASC_FILE"
            echo "$KEY_ASC" > "$KEY_ASC_FILE"
            gpg --batch --yes --import "$PUB_ASC_FILE"
            gpg --batch --yes --import "$KEY_ASC_FILE"
            GPG_LINUX_FINGERPRINT=$(gpg --list-keys --with-colons | grep '^fpr' | head -n 1 | cut -d: -f10)
            echo "$GPG_LINUX_FINGERPRINT:6:" | gpg --batch --import-ownertrust
            echo "GPG_LINUX_FINGERPRINT=$GPG_LINUX_FINGERPRINT" >> $GITHUB_ENV
          else
            echo "Signing skipped."
          fi

          sign_file() {
            if [[ "$SIGN_READY" == "true" ]]; then
              local file=$1
              gpg --batch --yes --detach-sign --armor -u "$GPG_LINUX_FINGERPRINT" "$file"
              if [ $? -ne 0 ]; then
                echo "Error: Failed to sign $file"
                exit 2
              fi
              echo "$file signed successfully."
            else
              echo "$file not signed (SIGN_READY=$SIGN_READY)"
            fi
          }

          # Pack and try sign final archive
          7z a -tzip rehlds-sven-bin-${{ env.APP_VERSION }}.zip bin/ hlsdk/ gamedir/
          sign_file "rehlds-sven-bin-${{ env.APP_VERSION }}.zip"

          # Pack and try sign final archive
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -aoa rehlds-sven-dbg-${{ env.APP_VERSION }}.7z debug/
          sign_file "rehlds-sven-dbg-${{ env.APP_VERSION }}.7z"

        shell: bash

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rehlds-sven-ci-${{ env.APP_VERSION }}
          path: |
            *.zip
            *.7z
            *.asc

      # Attach the archives with `gh` rather than softprops/action-gh-release. That action
      # PATCHes the release object before uploading, which fails here with
      # "Resource not accessible by integration ... update-a-release" even though the job
      # token has Contents: write -- it can add assets but not rewrite a release created by
      # a user. `gh release upload` only adds assets, which is all that is wanted, and it
      # drops a third-party action from the release path.
      - name: Release artifacts
        id: publish-job
        if: |
          startsWith(github.ref, 'refs/tags/') &&
          steps.packaging-job.outcome == 'success'
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.zip *.7z *.asc )
          if [ ${#files[@]} -eq 0 ]; then
            echo "FATAL: packaging produced no archives to upload" >&2
            exit 1
          fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
        shell: bash
        env:
          # API_TOKEN is an upstream ReHLDS secret this fork does not have; an empty token
          # makes the upload fail. Fall back to the automatic per-run token, which the
          # job-level `permissions: contents: write` above makes sufficient.
          GH_TOKEN: ${{ secrets.API_TOKEN || secrets.GITHUB_TOKEN }}
